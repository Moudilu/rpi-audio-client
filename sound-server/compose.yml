services:
  music-assistant-server:
    image: ghcr.io/music-assistant/server:latest # <<< Desired release version here (or use beta to get the latest beta version)
    container_name: music-assistant-server
    restart: unless-stopped
    networks:
      music-assistant:
        ipv4_address: 192.168.0.20
      local-caddy:
    volumes:
      - music-assistant-data:/data/
      - /srv/nc-data-no-bkp/Media:/media
    environment:
      # Provide logging level as environment variable.
      # default=info, possible=(critical, error, warning, info, debug)
      - LOG_LEVEL=info

networks:
  music-assistant:
    driver: ipvlan
    driver_opts:
      parent: enp0s31f6
      # to enable mDNS (which advertises the Spotify Connect service), the container must receive Multicast packets
      ipvlan_mode: l2
    ipam:
      config:
        - subnet: 192.168.0.0/24
          gateway: 192.168.0.1
  # if you are using Caddy as a reverse proxy, connect to its network
  local-caddy:
    external: true

volumes:
  music-assistant-data:
